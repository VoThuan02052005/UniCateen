# Build va kiem thu tu dong: unit test + test tich hop (MySQL 8 qua Testcontainers) + build giao dien
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    name: Backend - mvn verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build va chay test
        id: mvn
        working-directory: backend
        run: |
          set -o pipefail
          mvn -B verify 2>&1 | tee mvn.log
      - name: Tom tat ket qua test
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          rows, tot = [], [0, 0, 0, 0]
          for f in sorted(glob.glob('backend/target/surefire-reports/TEST-*.xml')):
              s = ET.parse(f).getroot()
              t, fl, e, sk = (int(s.get(k, 0)) for k in ('tests', 'failures', 'errors', 'skipped'))
              tot = [a + b for a, b in zip(tot, (t, fl, e, sk))]
              rows.append(f"| {s.get('name').split('.')[-1]} | {t} | {t - fl - e - sk} | {fl + e} | {s.get('time')} s |")
          print("## Ket qua kiem thu backend\n")
          print("| Lop test | So test | Dat | Loi | Thoi gian |\n|---|---|---|---|---|")
          print("\n".join(rows))
          print(f"\n**Tong: {tot[0]} test, {tot[0] - tot[1] - tot[2] - tot[3]} dat, {tot[1] + tot[2]} loi, {tot[3]} bo qua**")
          PY
      - name: Ghi log va bao cao test vao nhanh ci-results
        if: always()
        run: |
          mkdir -p /tmp/out/surefire
          cp backend/mvn.log /tmp/out/ 2>/dev/null || true
          cp backend/target/surefire-reports/*.txt backend/target/surefire-reports/*.xml /tmp/out/surefire/ 2>/dev/null || true
          echo "run=${{ github.run_id }} sha=${{ github.sha }} mvn=${{ steps.mvn.outcome }}" > /tmp/out/STATUS.txt
          cd /tmp/out
          git init -q -b ci-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "CI ${{ github.run_id }} ${{ steps.mvn.outcome }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results
      - name: Luu bao cao test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend - npm run build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cai dat va build
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

  e2e:
    name: E2E - he thong chay that, chup man hinh
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: unicateen
          MYSQL_USER: unicateen
          MYSQL_PASSWORD: unicateen
          MYSQL_ROOT_PASSWORD: root
          TZ: Asia/Ho_Chi_Minh
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build giao dien va dong goi JAR
        run: |
          (cd frontend && npm install --no-audit --no-fund && npm run build)
          (cd backend && mvn -B -q -Pwith-frontend -DskipTests package)
      - name: Khoi dong he thong (profile demo)
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/unicateen?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
        run: |
          nohup java -jar backend/target/unicateen-1.0.0.jar --spring.profiles.active=demo > app.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/auth/me || true)
            [ "$code" = "401" ] && echo "He thong da chay" && break
            sleep 3
          done
      - name: Chay kich ban giao dien va chup man hinh
        id: e2e
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          set -o pipefail
          node screens.mjs 2>&1 | tee e2e.log
      - name: Ghi ket qua vao nhanh ci-e2e
        if: always()
        run: |
          mkdir -p /tmp/e2e
          cp -r e2e/out/. /tmp/e2e/ 2>/dev/null || true
          cp e2e/e2e.log app.log /tmp/e2e/ 2>/dev/null || true
          echo "run=${{ github.run_id }} sha=${{ github.sha }} e2e=${{ steps.e2e.outcome }}" > /tmp/e2e/STATUS.txt
          cd /tmp/e2e
          git init -q -b ci-e2e
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "E2E ${{ github.run_id }} ${{ steps.e2e.outcome }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-e2e
