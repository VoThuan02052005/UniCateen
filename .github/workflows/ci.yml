# Build va kiem thu tu dong: unit test + test tich hop (MySQL 8 qua Testcontainers) + build giao dien
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend - mvn verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build va chay test
        working-directory: backend
        run: mvn -B verify
      - name: Tom tat ket qua test
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          rows, tot = [], [0, 0, 0, 0]
          for f in sorted(glob.glob('backend/target/surefire-reports/TEST-*.xml')):
              s = ET.parse(f).getroot()
              t, fl, e, sk = (int(s.get(k, 0)) for k in ('tests', 'failures', 'errors', 'skipped'))
              tot = [a + b for a, b in zip(tot, (t, fl, e, sk))]
              rows.append(f"| {s.get('name').split('.')[-1]} | {t} | {t - fl - e - sk} | {fl + e} | {s.get('time')} s |")
          print("## Ket qua kiem thu backend\n")
          print("| Lop test | So test | Dat | Loi | Thoi gian |\n|---|---|---|---|---|")
          print("\n".join(rows))
          print(f"\n**Tong: {tot[0]} test, {tot[0] - tot[1] - tot[2] - tot[3]} dat, {tot[1] + tot[2]} loi, {tot[3]} bo qua**")
          PY
      - name: Luu bao cao test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend - npm run build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cai dat va build
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
