# Quay video demo phan mem (kich ban 6 buoc) tren he thong chay that; ket qua ghi vao nhanh demo-video-out
name: Demo video

on:
  push:
    branches: [demo-video]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: unicateen
          MYSQL_USER: unicateen
          MYSQL_PASSWORD: unicateen
          MYSQL_ROOT_PASSWORD: root
          TZ: Asia/Ho_Chi_Minh
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build giao dien va dong goi JAR
        run: |
          (cd frontend && npm install --no-audit --no-fund && npm run build)
          (cd backend && mvn -B -q -Pwith-frontend -DskipTests package)
      - name: Khoi dong he thong (profile demo)
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/unicateen?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
        run: |
          nohup java -jar backend/target/unicateen-1.0.0.jar --spring.profiles.active=demo > app.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/auth/me || true)
            [ "$code" = "401" ] && echo "He thong da chay" && break
            sleep 3
          done
      - name: Quay video demo
        id: rec
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-core >/dev/null || true
          set -o pipefail
          node demo-video.mjs 2>&1 | tee demo.log
      - name: Ghep video thanh mot tep MP4
        if: always()
        working-directory: e2e/video
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -y -loglevel error -f concat -safe 0 -i list.txt -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -r 25 -movflags +faststart UniCateen_Demo.mp4
          ls -la
      - name: Ghi ket qua vao nhanh demo-video-out
        if: always()
        run: |
          mkdir -p /tmp/out
          cp e2e/video/UniCateen_Demo.mp4 e2e/demo.log app.log /tmp/out/ 2>/dev/null || true
          echo "run=${{ github.run_id }} sha=${{ github.sha }} rec=${{ steps.rec.outcome }}" > /tmp/out/STATUS.txt
          cd /tmp/out
          git init -q -b demo-video-out
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Demo video ${{ github.run_id }} ${{ steps.rec.outcome }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" demo-video-out
