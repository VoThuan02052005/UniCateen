spring:
  application:
    name: unicateen
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/unicateen?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USER:unicateen}
    password: ${DB_PASSWORD:unicateen}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none              # schema chi do Flyway quan ly (V1, V2, ...)
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m                # BR43: phien het han sau 30 phut khong thao tac
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}   # dat true khi chay sau HTTPS (NFR03)
        same-site: strict

unicateen:
  card:
    timeout-seconds: 10           # BR27: dich vu the qua 10 giay -> FAILED
    pending-expiry-minutes: 1     # BR27: giao dich the PENDING qua 1 phut -> FAILED
  transfer:
    needs-attention-minutes: 15   # BR27: chuyen khoan PENDING qua 15 phut -> Can xu ly
  login:
    max-failed-attempts: 5        # BR43
    lock-minutes: 15
  stock:
    expiry-warning-days: 3        # BR38

logging:
  level:
    vn.edu.phenikaa.unicateen: INFO
---
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/demo
